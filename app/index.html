<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaPlan</title>
    <meta name="description" content="KaPlan – Planlaufmanagement, Baubetriebsplanung und Projektsteuerung" />
    <meta name="theme-color" content="#f2f2f4" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /*
        Hell oder dunkel schon vor dem Start der Anwendung: fest gewählt unter
        „Angemeldet als“ (Farbschema „hell“ bzw. „dunkel“) oder – die Vorgabe –
        wie das Gerät eingestellt ist. Dieselbe Regel wie `istDunkel` in
        src/gemeinsam/benutzer.ts; die Hülle (src/shell/Shell.tsx) setzt den
        Wert nach dem Start erneut und folgt Änderungen. Ohne dieses Skript
        blitzte die Seite bei jedem Laden erst hell auf.
      */
      (function () {
        var schema = 'geraet';
        try {
          schema = (JSON.parse(localStorage.getItem('kaplan-benutzer.v1') || '{}') || {}).farbschema;
        } catch (e) {
          /* unlesbar – wie das Gerät */
        }
        var dunkel =
          schema === 'dunkel' ||
          (schema !== 'hell' && typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-farbschema', dunkel ? 'dunkel' : 'hell');
        var farbe = document.querySelector('meta[name="theme-color"]');
        if (farbe) farbe.setAttribute('content', dunkel ? '#121316' : '#f2f2f4');
      })();
    </script>
    <style>
      /* Seitengrund des Koralle-Designs schon vor dem Laden – hell und dunkel wie die Anwendung */
      html { background: #f2f2f4; color: #1b1c20; }
      .lade-hinweis { color: #1b1c20; }
      .lade-hinweis p { color: #62646d; }
      .lade-hinweis code { background: #ffffff; padding: .1rem .4rem; border-radius: 8px; }
      html[data-farbschema='dunkel'] { background: #121316; color: #f2f2f4; }
      html[data-farbschema='dunkel'] .lade-hinweis { color: #f2f2f4; }
      html[data-farbschema='dunkel'] .lade-hinweis p { color: #b1b3bb; }
      html[data-farbschema='dunkel'] .lade-hinweis code { background: #232429; }
    </style>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KaPlan" />
    <script type="module" crossorigin src="./assets/index-Bhq8mXvI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BZnonmB0.css">
  </head>
  <body>
    <div id="root">
      <!--
        Dieser Bereich ist nur sichtbar, solange die Anwendung nicht gestartet
        ist – React ersetzt den Inhalt von #root beim Laden.

        Wird die Seite statisch ausgeliefert (GitHub Pages mit der Quelle
        "Deploy from a branch" liefert den Quellcode statt des Builds), startet
        die Anwendung nicht. Das Skript unten wechselt dann automatisch zur
        gebauten Fassung im Unterverzeichnis ./app/. Dieser Build ist eingecheckt
        und wird vom Workflow nach jedem Push auf main erneuert (siehe README,
        Abschnitt „Veröffentlichen“). Fehlt er, bleibt der Hinweis stehen.
      -->
      <div class="lade-hinweis" style="font-family: Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 40rem; margin: 12vh auto; padding: 0 1.5rem; line-height: 1.5;">
        <h1 style="font-size: 1.4rem; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 .75rem;">KaPlan wird geladen …</h1>
        <p style="margin: 0 0 1rem;">
          Falls diese Meldung stehen bleibt, fehlt die gebaute Anwendung im Ordner
          <strong>app/</strong>. Sie entsteht mit <code>npm run build</code>
          und wird aus <code>dist/</code> nach
          <code>app/</code> übernommen.
        </p>
        <p style="margin: 0;">
          Lokal wird die Anwendung mit <code>npm run dev</code>
          gestartet oder mit <code>npm run build</code> gebaut.
        </p>
      </div>
    </div>
    <script>
      /*
        Notausgang für statisch ausgelieferten Quellcode: Startet die Anwendung
        nicht innerhalb von 1,5 Sekunden, wird auf die gebaute Fassung unter
        ./app/ gewechselt. Im Entwicklungsbetrieb meldet sich die Anwendung über
        window.planlaufGestartet und der Wechsel entfällt. Im fertigen Build
        entfällt er immer – dort gibt es kein app/, und ein langsam geladenes
        Programm darf nicht auf eine fehlende Seite umleiten.
      */
      (function () {
        if (/\/app\/?$/.test(location.pathname)) return;
        var zeitgeber = setTimeout(function () {
          // Nur der unverarbeitete Quellcode lädt /src/main.tsx; im Build ersetzt
          // Vite dieses Tag. Geprüft wird erst hier, weil es beim Start des
          // Zeitgebers noch nicht eingelesen ist.
          if (!document.querySelector('script[src$="/src/main.tsx"]')) return;
          location.replace('app/' + location.hash);
        }, 1500);
        window.planlaufGestartet = function () {
          clearTimeout(zeitgeber);
        };
      })();
    </script>
  </body>
</html>
